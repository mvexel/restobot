# Cosmo filter config for Resto-bot.
#
# Extracts restaurant POIs from an OSM PBF into GeoParquet, replacing the
# old osm2pgsql/poi.lua + PostgreSQL pipeline.
#
# Output is a single GeoParquet file. OSM nodes are emitted as points, and
# closed ways such as building polygons are reduced to their centroid.
#
#   cosmo convert -i region.osm.pbf -f pois.yaml -o ./data/pois.parquet --format parquet

table:
  name: pois
  filter: "amenity=restaurant"
  geometry:
    node: true
    way: false
    closed_way: centroid
    relation: false
  columns:
    - name: osm_type
      source: meta:type
    - name: osm_id
      source: meta:id
      type: integer
    - name: name
      source: tag:name
    - name: version
      source: meta:version
      type: integer
    - name: timestamp
      source: meta:timestamp
